<div class="container">
  <div class="search-container">
  </div>

  @if (books().length === 0) {
    <div class="empty-container">
      <mat-icon class="book-icon">menu_book</mat-icon>
      <span>No books yet</span>

      <div class="empty-container-actions">
        <input
          #fileInput
          type="file"
          accept=".xml"
          (change)="importBooks($event)"
          hidden>

        <button
          mat-stroked-button
          color="primary"
          (click)="fileInput.click()">
          <mat-icon>upload</mat-icon>
          Import books from XML
        </button>

        or
        <button
          mat-flat-button
          color="primary"
          (click)="addBook()"
        >
          Add first Book
        </button>
      </div>
    </div>

  } @else {
    <table
      mat-table
      [dataSource]="books()"
    >

      <ng-container matColumnDef="bookTitle">
        <th mat-header-cell *matHeaderCellDef>Book title</th>
        <td mat-cell *matCellDef="let book">
          {{ book.bookTitle }}
        </td>
      </ng-container>

      <ng-container matColumnDef="bookAuthor">
        <th mat-header-cell *matHeaderCellDef>Book author</th>
        <td mat-cell *matCellDef="let book">
          {{ book.bookAuthor }}
        </td>
      </ng-container>

      <ng-container matColumnDef="pages">
        <th mat-header-cell *matHeaderCellDef>Page count</th>
        <td mat-cell *matCellDef="let book">
          {{ book.pages }}
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>

        <td mat-cell *matCellDef="let book">
          <div class="actions">
            <button
              mat-icon-button
              color="primary"
              (click)="openEditDialog(book)"
              aria-label="Edit book">
              <mat-icon>edit</mat-icon>
            </button>

            <button
              mat-icon-button
              color="warn"
              (click)="deleteBook(book.id)">
              <mat-icon>delete</mat-icon>
            </button>
          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

    </table>

    <div class="main-actions-container">
      <button
        mat-raised-button
        color="accent"
        (click)="clearList()">
        <mat-icon>delete</mat-icon>
        Clear list
      </button>

      <button
        mat-flat-button
        color="accent"
        (click)="saveBooks()">
        <mat-icon>download</mat-icon>
        Save books
      </button>
    </div>
  }
</div>
